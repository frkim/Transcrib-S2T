name: Presentation

on:
  push:
    branches: [main]
    paths:
      - "docs/presentations/**"
      - ".github/workflows/presentation.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/presentations/**"
      - ".github/workflows/presentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Ne jamais interrompre un déploiement GitHub Pages en cours sur main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Marp deck (HTML, PDF, PPTX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/presentations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/presentations/package-lock.json

      - name: Install Marp CLI
        run: npm ci

      # Marp CLI renders PDF and PPTX with the Google Chrome preinstalled on the runner.
      - name: Build presentation
        run: npm run build

      - name: Upload presentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcrib-s2t-presentation
          path: docs/presentations/dist/
          if-no-files-found: error
          retention-days: 30

      # Site GitHub Pages : la présentation HTML en page d'accueil, PDF et PPTX en téléchargement.
      - name: Prepare GitHub Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          site="$RUNNER_TEMP/pages"
          mkdir -p "$site"
          cp dist/* "$site/"
          cp dist/transcrib-s2t.html "$site/index.html"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Summary
        run: |
          {
            echo "### Présentation Transcrib-S2T générée"
            echo ""
            echo "| Fichier | Taille |"
            echo "| --- | ---: |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Téléchargez l'artefact **transcrib-s2t-presentation** depuis le résumé de cette exécution."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy HTML presentation to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Présentation publiée sur GitHub Pages"
            echo ""
            echo "- HTML : ${PAGE_URL}"
            echo "- PDF : ${PAGE_URL}transcrib-s2t.pdf"
            echo "- PPTX : ${PAGE_URL}transcrib-s2t.pptx"
          } >> "$GITHUB_STEP_SUMMARY"
