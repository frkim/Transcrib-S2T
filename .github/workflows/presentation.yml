name: Presentation

on:
  push:
    branches: [main]
    paths:
      - "docs/presentations/**"
      - ".github/workflows/presentation.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/presentations/**"
      - ".github/workflows/presentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Marp deck (HTML, PDF, PPTX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/presentations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/presentations/package-lock.json

      - name: Install Marp CLI
        run: npm ci

      # Marp CLI renders PDF and PPTX with the Google Chrome preinstalled on the runner.
      - name: Build presentation
        run: npm run build

      - name: Upload presentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcrib-s2t-presentation
          path: docs/presentations/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Présentation Transcrib-S2T générée"
            echo ""
            echo "| Fichier | Taille |"
            echo "| --- | ---: |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Téléchargez l'artefact **transcrib-s2t-presentation** depuis le résumé de cette exécution."
          } >> "$GITHUB_STEP_SUMMARY"
