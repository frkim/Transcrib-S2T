# Run when commits are pushed to main
on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SPEECH_LANGUAGE: ${{ vars.SPEECH_LANGUAGE }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY_ENDPOINT: ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
      SERVICE_API_NAME: ${{ vars.SERVICE_API_NAME }}
      SERVICE_API_ENDPOINT_URL: ${{ vars.SERVICE_API_ENDPOINT_URL }}
      SERVICE_FRONTEND_NAME: ${{ vars.SERVICE_FRONTEND_NAME }}
      SERVICE_FRONTEND_ENDPOINT_URL: ${{ vars.SERVICE_FRONTEND_ENDPOINT_URL }}
      SERVICE_FUNCTIONS_NAME: ${{ vars.SERVICE_FUNCTIONS_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install azd
        uses: Azure/setup-azd@v2
      - name: Log in with Azure (service principal)
        run: |
          $creds = $Env:AZURE_CREDENTIALS | ConvertFrom-Json
          azd auth login `
            --client-id $creds.clientId `
            --client-secret $creds.clientSecret `
            --tenant-id $creds.tenantId
        shell: pwsh
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      # Infrastructure changes are provisioned deliberately from a validated
      # environment. Pushes to main only deploy application revisions.
      - name: Deploy Application
        run: azd deploy --no-prompt

